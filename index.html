<title>Curso de Astronomía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="katex.min.css">
<style>
/* Layout: cabecera fija con progreso, mapa del curso a la izquierda y una lección por pasos a la derecha. */
:root {
  --bg: #f1f3f8; --surface: #ffffff; --sunken: #e7eaf2;
  --ink: #141a2e; --muted: #566079; --line: #d5dae6;
  --accent: #2c47c9; --accent-ink: #ffffff; --accent-soft: #e3e8fb;
  --star: #a86a10; --star-soft: #fbf0d9;
  --ok: #1c7548; --ok-soft: #e0f3e8; --bad: #b0352c; --bad-soft: #fbe6e3;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --surface: #131a31; --sunken: #0f1529;
  --ink: #e9ecf6; --muted: #9ba5c1; --line: #28314f;
  --accent: #93a6ff; --accent-ink: #0b1020; --accent-soft: #1d2750;
  --star: #f0b84a; --star-soft: #2c2412;
  --ok: #62d09a; --ok-soft: #12301f; --bad: #f28d83; --bad-soft: #3a1815;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #131a31; --sunken: #0f1529;
  --ink: #e9ecf6; --muted: #9ba5c1; --line: #28314f;
  --accent: #93a6ff; --accent-ink: #0b1020; --accent-soft: #1d2750;
  --star: #f0b84a; --star-soft: #2c2412;
  --ok: #62d09a; --ok-soft: #12301f; --bad: #f28d83; --bad-soft: #3a1815;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
button { font: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0 }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line) }
.top-in { max-width: 1180px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px }
.brand svg { flex: none }
.cursos { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--sunken) }
.cursos a { font: 500 .8rem var(--body); color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 999px; white-space: nowrap }
.cursos a[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.meter { flex: 1 1 160px; min-width: 120px; display: flex; align-items: center; gap: 10px; font: 500 .78rem var(--mono); color: var(--muted) }
.bar { flex: 1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--star); border-radius: 3px; transition: width .3s }
.sync { font: .75rem var(--mono); color: var(--muted) }
.map-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: .9rem }

.shell { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 36px; align-items: start }
nav.map { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 96px); overflow: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px }
.fase-t { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
.fase ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px }
.fase a, .fase .prox { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: .93rem; line-height: 1.3 }
.fase a:hover { background: var(--sunken) }
.fase a[aria-current="page"] { background: var(--accent-soft); font-weight: 600 }
.fase .prox { color: var(--muted) }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); transform: translateY(-1px) }
.dot.part { border-color: var(--star); background: linear-gradient(90deg, var(--star) 50%, transparent 50%) }
.dot.done { border-color: var(--star); background: var(--star) }
.prox .dot { border-style: dotted }

main { min-width: 0; max-width: 760px }
.eyebrow { font: 500 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--star) }
.h-title { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 700; margin: 6px 0 8px }
.h-sub { color: var(--muted); margin: 0; max-width: 60ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px }

/* Inicio */
.next { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 24px 0 }
.next h2 { font-size: 1.25rem; margin: 4px 0 }
.next p { margin: 0; color: var(--muted); font-size: .95rem }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line) }
.btn:disabled { opacity: .5; cursor: default }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 30px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.stat b { display: block; font: 500 1.5rem var(--mono); font-variant-numeric: tabular-nums }
.stat span { font-size: .85rem; color: var(--muted) }
.ruta { display: flex; flex-direction: column; margin-top: 14px }
.ruta-f { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; padding-bottom: 22px; position: relative }
.ruta-f::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line) }
.ruta-f:last-child::before { display: none }
.ruta-n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font: 500 .85rem var(--mono); color: var(--muted) }
.ruta-f.on .ruta-n { border-color: var(--star); color: var(--star) }
.ruta-f h3 { font-size: 1.05rem; margin-top: 3px }
.ruta-f .meta { font: .75rem var(--mono); color: var(--muted) }
.ruta-f p { margin: 4px 0 0; color: var(--muted); font-size: .93rem }

/* Lección */
.steps { display: flex; gap: 6px; overflow-x: auto; margin: 22px 0 20px; padding-bottom: 4px }
.steps button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: .9rem }
.steps button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600 }
.sec h3 { font-size: 1.15rem; margin: 30px 0 8px }
.sec h3:first-child { margin-top: 0 }
.sec p, .sec li { max-width: 68ch }
.sec p { margin: 0 0 14px }
.lead { font-size: 1.15rem; line-height: 1.5 }
.nota { background: var(--star-soft); border-radius: var(--r); padding: 14px 16px; margin: 0 0 16px; font-size: .96rem }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; margin: 12px 0 16px }
math[display="block"] { overflow-x: auto; margin: 12px 0 16px; font-size: 1.1em }
.tabla { overflow-x: auto; margin: 0 0 16px }
pre { font: .88rem/1.55 var(--mono); background: var(--sunken); padding: 14px 16px; border-radius: 8px; margin: 0; overflow-x: auto; white-space: pre }
code { font-family: var(--mono); font-size: .92em }
table { border-collapse: collapse; width: 100%; font-size: .95rem }
th { text-align: left; font: 500 .72rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line) }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap }

/* Ejercicios */
.ej { margin-bottom: 20px; padding: 0; overflow: hidden }
.ej-h { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.ej-h h3 { margin: 0; font-size: 1.05rem; flex: 1 }
.nivel { font: 500 .7rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.nivel b { color: var(--star); letter-spacing: 2px }
.ej-b { padding: 16px 20px 6px }
.ej-b > p { margin: 0 0 12px }
.parte { padding: 14px 0; border-top: 1px dashed var(--line) }
.preg { display: flex; gap: 10px; margin-bottom: 10px }
.preg .l { font: 500 .85rem var(--mono); color: var(--muted); flex: none; padding-top: 2px }
.resp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.resp input[type="text"] { font: 1rem var(--mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 8.5em }
.resp input.expo { width: 3.6em; font-size: .85rem; padding: 4px 6px; transform: translateY(-9px) }
.resp .x10 { font: 1rem var(--mono); color: var(--muted) }
.resp .u { color: var(--muted); font-size: .95rem; margin-right: 6px }
.ops { display: flex; flex-direction: column; gap: 6px; width: 100% }
.ops label { display: flex; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: .96rem; line-height: 1.4 }
.ops label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.ops input { margin-top: 4px; flex: none }
.fb { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: .95rem }
.fb.ok { background: var(--ok-soft); color: var(--ok) }
.fb.no { background: var(--bad-soft); color: var(--bad) }
.fb.info { background: var(--sunken); color: var(--ink) }
.acc { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: .92rem }
.sol { margin-top: 10px; padding: 12px 14px; border-left: 3px solid var(--star); background: var(--sunken); border-radius: 0 8px 8px 0; font-size: .96rem; overflow-x: auto }
.opc { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 6px }

/* Práctica */
.campo { display: flex; flex-direction: column; gap: 6px; margin: 16px 0 }
.campo label { font-weight: 600; font-size: .95rem }
textarea { font: 1rem/1.5 var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-height: 96px; resize: vertical; width: 100% }
.tareas { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 4px }
.tareas label { display: flex; gap: 10px; padding: 8px 0; cursor: pointer }
.tareas input { width: 18px; height: 18px; margin-top: 4px; flex: none; accent-color: var(--star) }
.tareas input:checked + span { color: var(--muted); text-decoration: line-through }
.puntos { padding-left: 20px; display: flex; flex-direction: column; gap: 10px }

/* Widgets */
.w { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin: 4px 0 18px }
.w input[type="range"] { width: 100%; accent-color: var(--star); margin: 10px 0 2px }
.w-big { font: 500 clamp(1.5rem, 5vw, 2.1rem) var(--mono); font-variant-numeric: tabular-nums }
.w-big sup { font-size: .55em }
.w-txt { margin: 4px 0 0; min-height: 3.2em }
.w-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 10px }
.w-row div { font-size: .82rem; color: var(--muted) }
.w-row b { display: block; font: 500 1.1rem var(--mono); color: var(--ink); font-variant-numeric: tabular-nums }
.w-cap { font: .75rem var(--mono); color: var(--muted); display: flex; justify-content: space-between }
.w svg { width: 100%; height: auto; display: block; margin-top: 8px }

/* Tutor */
.tutor { margin-top: 36px }
.tutor h3 { font-size: 1.05rem; margin-bottom: 4px }
.tutor p.h { margin: 0 0 12px; color: var(--muted); font-size: .92rem }
.tutor form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap }
.tutor textarea { min-height: 52px; flex: 1 1 260px }
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px }
.msg { padding: 10px 14px; border-radius: 10px; font-size: .96rem; max-width: 100%; overflow-x: auto }
.msg.u { background: var(--accent-soft); align-self: flex-end }
.msg.t { background: var(--sunken) }
.msg p { margin: 0 0 8px } .msg p:last-child { margin: 0 }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0 }
  nav.map { position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 20px }
  nav.map:not(.open) { display: none }
  .map-btn { display: inline-block }
  .sync { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
